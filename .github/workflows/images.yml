name: Images

# Baut die Docker-Images auf GitHub (nichts lokal) und veröffentlicht sie in ghcr.io: latest + dev + sha-<commit>. Schreibrecht auf die ghcr-Pakete kommt aus den Paketeinstellungen (Actions access: Repository mit Write oder Admin).
# Versionierte Images (v1.2.3) und Agent-Binaries kommen weiterhin aus release.yml beim Tag.
on:
  push:
    branches: [dev, main]
    paths: ["server/**", "web/**", "crates/**", "agent/**", "Cargo.*", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Welche Images müssen neu gebaut werden? Nur die, deren Quellen sich seit dem letzten Push geändert haben (der Rust-Build dauert Minuten).
  changes:
    name: Änderungen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.c.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: c
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          images='["server","web"]'
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if ! echo "$files" | grep -q '^\.github/workflows/images\.yml$'; then
              list=""
              if echo "$files" | grep -Eq '^(server/|crates/|agent/|Cargo\.)'; then list='"server"'; fi
              if echo "$files" | grep -q '^web/'; then list="${list:+$list,}\"web\""; fi
              images="[$list]"
            fi
          fi
          echo "Zu bauen: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  images:
    name: Docker (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/einniki/patchwatch-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=dev
            type=sha,prefix=sha-
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
