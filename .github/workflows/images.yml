name: Images

# Baut die Docker-Images auf GitHub (nichts lokal) und veröffentlicht sie in ghcr.io: latest + dev + sha-<commit>.
# Versionierte Images (v1.2.3) und Agent-Binaries kommen weiterhin aus release.yml beim Tag.
on:
  push:
    branches: [dev, main]
    paths: ["server/**", "web/**", "crates/**", "Cargo.*", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [server, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/einniki/patchwatch-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=dev
            type=sha,prefix=sha-
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
