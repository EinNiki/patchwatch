name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Ohne Signaturschlüssel gibt es keine Agent-Artefakte (ungeprüfte Dateien werden nie veröffentlicht). Statt eines
  # roten Laufs meldet dieser Job eine Warnung und überspringt Agent und GitHub Release. Die Docker-Images laufen immer.
  signing-key:
    name: Signaturschlüssel prüfen
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MINISIGN_SECRET_KEY fehlt: Agent-Binaries und GitHub Release werden übersprungen (README, Release-Signatur einrichten)"
          fi

  agent:
    name: agent (${{ matrix.target }})
    needs: signing-key
    if: needs.signing-key.outputs.present == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p patchwatch-agent --target ${{ matrix.target }}
      - name: Binary und Prüfsumme bereitstellen
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/patchwatch-agent dist/patchwatch-agent-${{ matrix.arch }}-linux
          (cd dist && sha256sum patchwatch-agent-${{ matrix.arch }}-linux > patchwatch-agent-${{ matrix.arch }}-linux.sha256)
          # install.sh wird einmal (x86_64-Lauf) mit veröffentlicht.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp agent/dist/install.sh dist/install.sh
            (cd dist && sha256sum install.sh > install.sh.sha256)
          fi
      # Signatur (minisign). VORAUSSETZUNG, einmalig: Geheimnis MINISIGN_SECRET_KEY im Repository anlegen (siehe
      # README, "Release-Signatur einrichten"). Fehlt es, bricht der Release ab: ungeprüfte Artefakte gibt es nicht.
      - name: Binary signieren
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::Geheimnis MINISIGN_SECRET_KEY fehlt - Release-Signatur nicht eingerichtet (README)"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          # Schlüsseldatei schreiben. Wurde nur die zweite Zeile (Base64) als Geheimnis eingetragen, fehlt die
          # Kommentarzeile: sie wird ergänzt, damit minisign die Datei lesen kann.
          (umask 077
           if [ "$(printf '%s\n' "$MINISIGN_SECRET_KEY" | grep -c .)" -eq 1 ]; then
             printf 'untrusted comment: minisign encrypted secret key\n%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
           else
             printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
           fi)
          # Schlüssel ohne Passwort (minisign -G -W). Fehlermeldungen von minisign bleiben sichtbar (sie enthalten
          # keinen Schlüsselinhalt); nur die Standardausgabe wird unterdrückt.
          minisign -S -s "$keyfile" -m dist/patchwatch-agent-${{ matrix.arch }}-linux \
            -x dist/patchwatch-agent-${{ matrix.arch }}-linux.minisig -t "patchwatch ${{ github.ref_name }}" </dev/null >/dev/null \
            || { echo "::error::Signieren fehlgeschlagen: MINISIGN_SECRET_KEY muss der komplette Inhalt von patchwatch.key sein (beide Zeilen, ohne Passwort erzeugt mit minisign -G -W)"; exit 1; }
      # Gegenprobe: die Signatur muss zum öffentlichen Schlüssel in install.sh passen, sonst würden Hosts sie ablehnen.
      - name: Signatur mit öffentlichem Schlüssel prüfen
        run: |
          pub="$(sed -n 's/^PW_PUBKEY="\(.*\)"$/\1/p' agent/dist/install.sh)"
          minisign -V -P "$pub" -m dist/patchwatch-agent-${{ matrix.arch }}-linux \
            -x dist/patchwatch-agent-${{ matrix.arch }}-linux.minisig \
            || { echo "::error::Geheimer Schlüssel (Geheimnis) und PW_PUBKEY in install.sh gehören nicht zusammen"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-${{ matrix.arch }}
          path: dist/*

  github-release:
    name: GitHub Release
    needs: [signing-key, agent]
    if: needs.signing-key.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: agent-*
          merge-multiple: true
          path: dist
      - name: Gesamt-Prüfsummendatei
        run: cd dist && cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
          generate_release_notes: true

  images:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [server, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/einniki/patchwatch-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
