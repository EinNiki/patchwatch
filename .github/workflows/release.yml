name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  agent:
    name: agent (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p patchwatch-agent --target ${{ matrix.target }}
      - name: Binary und Prüfsumme bereitstellen
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/patchwatch-agent dist/patchwatch-agent-${{ matrix.arch }}-linux
          (cd dist && sha256sum patchwatch-agent-${{ matrix.arch }}-linux > patchwatch-agent-${{ matrix.arch }}-linux.sha256)
          # install.sh wird einmal (x86_64-Lauf) mit veröffentlicht.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp agent/dist/install.sh dist/install.sh
            (cd dist && sha256sum install.sh > install.sh.sha256)
          fi
      # Signatur (minisign). VORAUSSETZUNG, einmalig: Geheimnis MINISIGN_SECRET_KEY im Repository anlegen (siehe
      # README, "Release-Signatur einrichten"). Fehlt es, bricht der Release ab: ungeprüfte Artefakte gibt es nicht.
      - name: Binary signieren
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::Geheimnis MINISIGN_SECRET_KEY fehlt - Release-Signatur nicht eingerichtet (README)"
            exit 1
          fi
          sudo apt-get install -y minisign
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile")
          # Schlüssel ohne Passwort (minisign -G -W); Ausgabe unterdrückt, damit nichts im Log landet.
          minisign -S -s "$keyfile" -m dist/patchwatch-agent-${{ matrix.arch }}-linux \
            -x dist/patchwatch-agent-${{ matrix.arch }}-linux.minisig -t "patchwatch ${{ github.ref_name }}" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-${{ matrix.arch }}
          path: dist/*

  github-release:
    name: GitHub Release
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: agent-*
          merge-multiple: true
          path: dist
      - name: Gesamt-Prüfsummendatei
        run: cd dist && cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
          generate_release_notes: true

  images:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [server, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/einniki/patchwatch-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
