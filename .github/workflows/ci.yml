name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchwatch
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: patchwatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U patchwatch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://patchwatch:ci-only-password@localhost:5432/patchwatch
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Installer (Prüfsumme, Signatur, Update)
        run: |
          sh agent/tests/install_test.sh
          shellcheck -s sh -S warning agent/dist/install.sh

  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prüfen, ob web/ schon existiert
        id: has_web
        working-directory: .
        run: echo "present=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has_web.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.has_web.outputs.present == 'true'
        run: npm ci
      - if: steps.has_web.outputs.present == 'true'
        run: npm run lint
      - if: steps.has_web.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.has_web.outputs.present == 'true'
        run: npm run build
