# patchwatch: Postgres, Server und Web-Oberfläche. Alle Einstellungen stehen in der Datei .env
# (Vorlage: .env.example). Es wird nichts lokal gebaut, die Images kommen aus ghcr.io.
#
# Ein Reverse-Proxy ist nicht enthalten: Er muss /api/* an Port 8080 (Server) und alles andere
# an Port 3000 (Web-Oberfläche) weiterleiten. Beispiel: README, Abschnitt "Betrieb mit TLS".
# Update: Tag bei "image:" ändern, dann `docker compose pull && docker compose up -d`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchwatch
      POSTGRES_DB: patchwatch
    env_file:
      - .env
    volumes:
      # ANPASSEN: Ordner auf deinem Host, in dem die Datenbank liegt (wird beim ersten Start angelegt).
      - /home/docker/patchwach/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchwatch -d patchwatch"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]

  server:
    # ANPASSEN: gewünschte Version (Tags: https://github.com/EinNiki/patchwatch/releases)
    image: ghcr.io/einniki/patchwatch-server:0.2.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      # Host-Port:Container-Port. Ohne IP davor ist der Port auf allen Netzwerkkarten offen
      # (nur im Heimnetz oder hinter einer Firewall). Nur LAN: "192.168.1.10:8080:8080".
      - "8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    # ANPASSEN: dieselbe Version wie beim Server
    image: ghcr.io/einniki/patchwatch-web:0.2.2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Wie beim Server: Host-Port:Container-Port
      - "3000:3000"
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
