[package]
name = "patchwatch-server"
version = "0.1.0"
description = "patchwatch Server: Report-API, CVE-Abgleich, Benachrichtigungen"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "patchwatch_server"
path = "src/lib.rs"

[[bin]]
name = "patchwatch-server"
path = "src/main.rs"

[dependencies]
debversion = { path = "../crates/debversion" }
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono", "json"] }
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
bzip2 = "0.6"
quick-xml = "0.38"
webauthn-rs = "0.5.4"
webauthn-rs-proto = "0.5.4"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
uuid = { version = "1.26.1", features = ["v4"] }
url = "2.5.8"
openssl = { version = "0.10.82", features = ["vendored"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
